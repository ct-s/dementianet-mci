# Central configuration for the DementiaNet mini-project.
# Keep all paths, hyperparameters, and constants here — never hard-code in scripts.

seed: 42

paths:
  data_raw: data/raw            # original downloaded audio (gitignored)
  data_interim: data/interim    # standardized wavs (16 kHz mono)
  data_processed: data/processed  # feature tables (CSV/parquet)
  metadata: data/external/dementianet_metadata.csv  # from the project's Google Sheet
  results_figures: results/figures
  results_tables: results/tables
  praat_dir: praat                       # downloaded uhm-o-meter scripts (gitignored)
  syllable_nuclei_script: praat/syllablenuclei_v3.praat   # orchestrator; calls FilledPauses.praat
  filled_pauses_script: praat/filledpauses.praat    # stage-2 detector (called by v3)

audio:
  target_sample_rate: 16000     # Hz; standardize everything to this
  mono: true
  clip_min_seconds: 5           # discard clips shorter than this

features:
  opensmile_feature_set: eGeMAPSv02   # jitter, shimmer, HNR, F0, loudness...
  opensmile_feature_level: Functionals
  pause:
    min_pause_ms: 180           # short/long pause boundary (He et al. 2025)
    silence_threshold_db: -35   # below this = silence
  filled_pauses:                # Syllable Nuclei v3 + FilledPauses (De Jong et al. 2019)
    language: English           # English or Dutch (script is tuned per language)
    threshold: 1.0              # filled-pause cut-off; higher -> fewer false positives
    silence_threshold_db: -25   # v3 syllable-nuclei silence threshold
    min_dip_db: 2               # v3 minimum dip between intensity peaks
    min_pause_s: 0.3            # v3 minimum silent-pause duration

# Time-before-diagnosis buckets for the longitudinal analysis (dementia group)
time_buckets:
  - post_diagnosis
  - 0_5_years
  - 5_10_years
  - 10_15_years

dataset:
  manifest: data/processed/manifest.csv
  # Inclusion criteria (decided BEFORE looking at results). Excludes Lewy body,
  # Parkinson, and PPA due to distinct motor/aphasic speech phenotypes (report 8.1).
  include_dx: [Alzheimer, Dementia, control]
  positive_dx: [Alzheimer, Dementia]   # these form the positive (dementia) class; control = negative
  test_size: 0.25       # fraction of SPEAKERS held out as the locked test set
  split_seed: 42        # fixed so the dev/test split never drifts

model:
  cv_folds: 5
  group_column: speaker_id      # speaker-independent splits (avoid leakage)
  use_acoustic: true           # set true once acoustic_egemaps.csv exists
  use_filled_pauses: false    # ablation showed no added signal on this corpus (see report)
  # Features excluded from the model (kept in CSVs for confound analysis).
  # duration_s: clip length is a data-collection artifact (how the YouTube clip
  #   was trimmed), not a speaker property -> must not be a predictor.
  # raw counts: superseded by the duration-normalized *_rate features.
  exclude_features: [duration_s, n_pauses, n_long_pauses, n_short_pauses]
  classifiers:
    - logistic_regression
    - svm_rbf
    - gradient_boosting
